# JugglucoNGmod: build of build type `mod` (phone + wear) and checks on the APKs.
#
# test-build (push to main or feature/**, not a push of .md files only; or Run workflow with release 0):
#   no environment, no secrets. Signed with a one-time key the job creates and deletes itself; release number 0
#   (versionName ...-mod0). Its APKs are for checks and the emulator only, never for a phone or a
#   watch: Android would not install the next build over it. The phone of a test build carries the
#   CareLink trial (Common/src/modTrial); a last step builds the phone again as a candidate would
#   (-PmodRelease=1, another one-time key, nothing uploaded) and checks the trial is not in it.
#
# Candidate (Run workflow on main with release 1..99 and the block branches to test, space-separated,
# may be empty): main + those branches merged in this run, signed with our key; the APKs stay on the
# run page (artifact, 14 days; the job log with their sha256 - 90 days), mod/apk-keep.py fetch copies
# them to the owner's computer, they are installed by hand. Owner's decision 25.11.2026: blocks accepted
# with one candidate go to main with one PR of the joint branch; a block tested alone goes with its own PR.
# The run publishes nothing (owner's decision 25.11.2026): a GitHub release for everyone only after the
# owner's "all ok" on the phone for this candidate - mod/publish-candidate.py mod-X.Y.Z-N --publish uploads
# the very files of the owner's copy (sha256 = this run's log, no rebuild), only for a candidate of main
# alone; it sets the tag and makes the release normal and Latest (the in-app updater skips drafts and
# pre-releases).
#   candidate-precheck  no secrets: inputs, release N above every mod-X.Y.Z-M tag and every earlier
#                       candidate of this version that built APKs or has not finished, never again in
#                       a re-run (mod/candidate-number.sh, again first in candidate-build), branches exist,
#                       they merge into main cleanly and bring no upstream commit that main does not
#                       have (sync/... branches with fresh upstream code never get the key);
#                       their code in main is exactly one of their releases without the pre-release
#                       mark, published at least 7 days ago (spec 3.6; hold=0 skips both, urgent
#                       candidate only by the owner's word);
#   candidate-build     environment mod-signing (manual approval, branch main only): our key from the
#                       environment secrets, in a temp dir outside the repo, deleted; no Gradle cache,
#                       no daemon, no configuration cache (as upstream signed-build.yml); checks with
#                       --mode release (our certificate) and update-manifest.json; candidate.txt with
#                       the sha256 of the files goes into the log too (mod/publish-candidate.py reads it).
# The former job publish (published right after the build, switched off by the variable
# MOD_PUBLISH_RELEASES since 25.11.2026) is gone since 26.11.2026: the variable is read by nothing.
# Tags mod-X.Y.Z-N: mod/publish-candidate.py sets them with the release; for a candidate with block
# branches - by hand on main after the owner's "ok". They build nothing.
name: MOD build
# Candidate runs carry their number and block branches in the run name: mod-remind.yml reads them.
# Other runs get GitHub's default name (a run-name of only whitespace falls back to it).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release != '0' &&
  format('MOD candidate {0} blocks: {1}{2}', inputs.release, inputs.blocks || '-', inputs.hold == '0' && ' (hold=0)' || '') || ' ' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: '0 = test build (one-time key); 1..99 = candidate with our key (above every mod-X.Y.Z-N tag and earlier candidate)'
        required: true
        default: '0'
      blocks:
        description: 'candidate only: block branches merged onto main, space-separated (empty = main alone)'
        required: false
        default: ''
      hold:
        description: 'candidate only: 1 = their code in main must be their release, 7+ days old; 0 = urgent, only by the owner word'
        required: false
        default: '1'
  push:
    branches: [main, 'feature/**']
    # a push of .md files only builds nothing (owner's word 15.11; its PR gets the light MOD sync check)
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  # manual runs: a group of their own, so a candidate waiting for approval never holds or cancels another run
  group: mod-build-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test-build:
    name: mod test build (one-time key, -mod0)
    if: >-
      github.repository == 'lbarmen/JugglucoNGmod' &&
      (github.event_name == 'push' || inputs.release == '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # .gitmodules stays upstream's; our copy is used only when upstream's libjuice is unreachable.
      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the hooks check in check-apk)
        run: |
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script, versions from Common/build.gradle)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      - name: Build mod phone + wear with a one-time signing key
        run: |
          set -euo pipefail
          umask 077
          kdir=$(mktemp -d "$RUNNER_TEMP/mod-onetime.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$kdir/onetime.p12" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias onetime -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JugglucoNGmod one-time test key" > /dev/null 2>&1
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/onetime.p12"
          export ORG_GRADLE_PROJECT_thepassword="$pw"
          export ORG_GRADLE_PROJECT_thekeyalias=onetime
          export ORG_GRADLE_PROJECT_thekeypassword="$pw"
          # phone and wear in separate calls: wear needs final R ids (see mod/gradlew-mod.sh)
          bash mod/gradlew-mod.sh :Common:assembleMobileMod \
            -PmodRelease=0 --no-daemon --no-configuration-cache --stacktrace
          bash mod/gradlew-mod.sh :Common:assembleWearMod \
            -PmodRelease=0 --no-daemon --no-configuration-cache --stacktrace

      - name: Checks on the APKs
        run: |
          set -euo pipefail
          phone=$(ls Common/build/outputs/apk/mobile/mod/*.apk)
          wear=$(ls Common/build/outputs/apk/wear/mod/*.apk)
          echo "phone: $phone"; echo "wear: $wear"
          python3 mod/check-apk.py --phone "$phone" --wear "$wear" --release 0 --mode test | tee mod-checks.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mod-test-${{ github.sha }}
          path: |
            Common/build/outputs/apk/mobile/mod/*.apk
            Common/build/outputs/apk/wear/mod/*.apk
            mod-checks.txt
          if-no-files-found: warn
          retention-days: 14

      # CareLink trial (part 4p): a phone built like a candidate (-PmodRelease=1) has no trial. After the upload on
      # purpose: this APK has the same file name and replaces the -mod0 one; nothing of it is uploaded. Its own
      # one-time key (the build step's key is gone with its kdir).
      - name: Candidate-like phone (-mod1) has no CareLink trial
        run: |
          set -euo pipefail
          umask 077
          start=$(date +%s)
          kdir=$(mktemp -d "$RUNNER_TEMP/mod-onetime-trial.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$kdir/onetime.p12" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias onetime -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JugglucoNGmod one-time test key" > /dev/null 2>&1
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/onetime.p12"
          export ORG_GRADLE_PROJECT_thepassword="$pw"
          export ORG_GRADLE_PROJECT_thekeyalias=onetime
          export ORG_GRADLE_PROJECT_thekeypassword="$pw"
          bash mod/gradlew-mod.sh :Common:assembleMobileMod \
            -PmodRelease=1 --no-daemon --no-configuration-cache --stacktrace
          phone=$(ls Common/build/outputs/apk/mobile/mod/*.apk)
          python3 mod/check-apk.py --trial-absent "$phone"
          echo "candidate-like phone build and check: $(( ($(date +%s) - start) / 60 )) min"

  candidate-precheck:
    name: mod candidate precheck (inputs, branches, no new upstream code)
    if: >-
      github.repository == 'lbarmen/JugglucoNGmod' && github.event_name == 'workflow_dispatch' &&
      inputs.release != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # earlier candidate runs of this workflow (release number)
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      blocks: ${{ steps.check.outputs.blocks }}
      pins: ${{ steps.check.outputs.pins }}
      tree: ${{ steps.check.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: Release number, block branches, merge onto main, upstream code = main's
        env:
          REL: ${{ inputs.release }}
          BLOCKS: ${{ inputs.blocks }}
          HOLD: ${{ inputs.hold }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the candidate on main (Use workflow from: main)"; exit 1; }
          [[ "$REL" =~ ^[1-9][0-9]?$ ]] || { echo "::error::release '$REL' is not 1..99"; exit 1; }
          up=$(sed -n "s/.*appVersionName *= *'\([^']*\)'.*/\1/p" Common/build.gradle | head -1)
          ver="${up%%-*}"
          [ -n "$ver" ] || { echo "::error::appVersionName not found in Common/build.gradle"; exit 1; }
          git fetch --no-tags origin "+refs/tags/mod-*:refs/tags/mod-*" || true
          # above every tag and every earlier candidate of this version; never again in a re-run (owner's word 15.11)
          bash mod/candidate-number.sh "$ver" "$REL"
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main
          list=""; pins=""
          for b in $BLOCKS; do
            [[ "$b" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::branch name '$b' has odd characters"; exit 1; }
            case "$b" in main|upstream|upstream/*|sync/*) echo "::error::'$b' is not a block branch"; exit 1;; esac
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" || {
              echo "::error::branch '$b' is not on GitHub"; exit 1; }
            git -c user.name=mod-candidate -c user.email=mod-candidate@users.noreply.github.com \
              merge --no-ff --no-edit "origin/$b" || { echo "::error::'$b' does not merge cleanly onto main + earlier blocks"; exit 1; }
            list="$list $b"; pins="${pins:-} $b@$(git rev-parse "origin/$b")"
          done
          all=$(git rev-list --count HEAD "^$GITHUB_SHA")
          ours=$(git rev-list --count HEAD "^$GITHUB_SHA" ^upstream/main)
          [ "$all" = "$ours" ] || {
            echo "::error::the block branches bring $((all - ours)) upstream commit(s) that main does not have"; exit 1; }
          # spec 3.6: their code in main = one of their releases (no pre-release mark), 7+ days old
          case "${HOLD:-1}" in
            0) echo "::warning::hold=0: release and 7-day checks skipped (urgent candidate, owner's word)" ;;
            1)
              theirs=$(git merge-base "$GITHUB_SHA" upstream/main)
              tags=$(git ls-remote --tags upstream | awk -v c="$theirs" '
                { n=$2; sub("refs/tags/","",n); p=sub(/\^\{\}$/,"",n); if (p || !(n in m)) m[n]=$1 }
                END { for (n in m) if (m[n]==c) print n }')
              rels=$(gh api "repos/ctqvva/JugglucoNG/releases?per_page=100" --jq \
                '.[] | select(.draft | not) | select(.prerelease | not) | "\(.tag_name) \(.published_at)"')
              # several of their releases on this commit -> the oldest one (same code, public since then)
              match=$(for t in $tags; do printf '%s\n' "$rels" | awk -v t="$t" '$1==t'; done | sort -k2 | head -1)
              [ -n "$match" ] || {
                echo "::error::their code in main (${theirs:0:9}) is not one of their releases without the pre-release mark (tags there: ${tags:-none}); merge a release first (mod/SYNC.md) or hold=0 by the owner's word"; exit 1; }
              # a tag moved onto a newer commit counts from that commit, not from the release date
              t_pub=$(date -d "${match#* }" +%s); t_commit=$(git show -s --format=%ct "$theirs")
              age=$(( ( $(date +%s) - (t_pub > t_commit ? t_pub : t_commit) ) / 86400 ))
              [ "$age" -ge 7 ] || {
                echo "::error::their release ${match%% *} is $age day(s) old; a candidate for the phone waits 7 days (spec 3.6) or hold=0 by the owner's word"; exit 1; }
              echo "OK: their code in main = their release ${match%% *}, $age days old" ;;
            *) echo "::error::hold '$HOLD' is not 0 or 1"; exit 1 ;;
          esac
          echo "OK: candidate $ver-$REL = main ${GITHUB_SHA:0:7} +${list:- (no blocks)}; $all own commit(s) on top"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "blocks=${list# }" >> "$GITHUB_OUTPUT"
          echo "pins=${pins# }" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  candidate-build:
    name: mod candidate build with our key (environment mod-signing)
    needs: candidate-precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: mod-signing
    permissions:
      contents: read
      actions: read   # earlier candidate runs of this workflow (release number)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # "Re-run failed jobs" / "Re-run this job" start here with the precheck of an earlier attempt: number again
      - name: Release number still free (no secrets in this step)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.candidate-precheck.outputs.release }}
          VERSION: ${{ needs.candidate-precheck.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/mod-*:refs/tags/mod-*" || true
          bash mod/candidate-number.sh "$VERSION" "$RELEASE"

      # exactly the commits the precheck checked: a branch moved while the run waited for approval -> stop
      - name: Merge the block branches onto main (the commits and the tree the precheck checked)
        env:
          PINS: ${{ needs.candidate-precheck.outputs.pins }}
          TREE: ${{ needs.candidate-precheck.outputs.tree }}
        run: |
          set -euo pipefail
          for p in $PINS; do
            b="${p%@*}"; sha="${p##*@}"
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b"
            [ "$(git rev-parse "origin/$b")" = "$sha" ] || {
              echo "::error::branch '$b' moved after the precheck (${sha:0:9} -> $(git rev-parse --short "origin/$b")): run the candidate again"; exit 1; }
            git -c user.name=mod-candidate -c user.email=mod-candidate@users.noreply.github.com \
              merge --no-ff --no-edit "origin/$b"
          done
          [ "$(git rev-parse 'HEAD^{tree}')" = "$TREE" ] || { echo "::error::the tree differs from the one the precheck checked"; exit 1; }
          git log --oneline -1

      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the hooks check in check-apk)
        run: |
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script, versions from Common/build.gradle)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      # No Gradle cache: configuration caches may contain signing properties.
      # The key exists only inside this step, outside the repository and the artifacts.
      - name: Build mod phone + wear with our key
        env:
          RELEASE: ${{ needs.candidate-precheck.outputs.release }}
          KEYSTORE_BASE64: ${{ secrets.MOD_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_thepassword: ${{ secrets.MOD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_thekeyalias: ${{ secrets.MOD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_thekeypassword: ${{ secrets.MOD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ORG_GRADLE_PROJECT_thepassword" ] || \
             [ -z "$ORG_GRADLE_PROJECT_thekeyalias" ] || [ -z "$ORG_GRADLE_PROJECT_thekeypassword" ]; then
            echo "::error::mod-signing: one of the four MOD_ secrets is empty"; exit 1
          fi
          kdir=$(mktemp -d "$RUNNER_TEMP/mod-signing.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$kdir/mod-release.jks"
          unset KEYSTORE_BASE64
          keytool -list -keystore "$kdir/mod-release.jks" -storepass:env ORG_GRADLE_PROJECT_thepassword \
            -alias "$ORG_GRADLE_PROJECT_thekeyalias" > /dev/null 2>&1 || {
            echo "::error::mod-signing: key file, store password and alias do not fit together"; exit 1; }
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/mod-release.jks"
          # phone and wear in separate calls: wear needs final R ids (see mod/gradlew-mod.sh)
          bash mod/gradlew-mod.sh :Common:assembleMobileMod \
            -PmodRelease="$RELEASE" --no-daemon --no-configuration-cache --stacktrace
          bash mod/gradlew-mod.sh :Common:assembleWearMod \
            -PmodRelease="$RELEASE" --no-daemon --no-configuration-cache --stacktrace

      - name: Candidate files, update-manifest.json, checks (our certificate)
        env:
          RELEASE: ${{ needs.candidate-precheck.outputs.release }}
          VERSION: ${{ needs.candidate-precheck.outputs.version }}
          BLOCKS: ${{ needs.candidate-precheck.outputs.blocks }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          phones=(Common/build/outputs/apk/mobile/mod/*.apk); wears=(Common/build/outputs/apk/wear/mod/*.apk)
          [ ${#phones[@]} = 1 ] && [ ${#wears[@]} = 1 ] || {
            echo "::error::expected one phone and one wear APK: ${phones[*]} / ${wears[*]}"; exit 1; }
          mkdir dist
          phone="dist/JugglucoNGmod-$VERSION-$RELEASE.apk"
          wear="dist/JugglucoNGmod-$VERSION-$RELEASE-wear.apk"
          cp "${phones[0]}" "$phone"
          cp "${wears[0]}" "$wear"
          python3 mod/make-update-manifest.py --phone "$phone" > dist/update-manifest.json
          python3 mod/check-apk.py --phone "$phone" --wear "$wear" --release "$RELEASE" --mode release \
            --manifest dist/update-manifest.json | tee mod-checks.txt
          # the sha256sum lines go into this job's log: mod/publish-candidate.py checks the owner's copy against them
          {
            echo "candidate $VERSION-$RELEASE"
            echo "main:   $GITHUB_SHA"
            echo "blocks: ${BLOCKS:-(none)}"
            echo "built:  $(git rev-parse HEAD)"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "cert:   $(tr -d '[:space:]' < mod/mod-cert.sha256)"
            (cd dist && sha256sum *)
          } | tee dist/candidate.txt
          up=$(sed -n "s/.*appVersionName *= *'\([^']*\)'.*/\1/p" Common/build.gradle | head -1)
          sed -e "s|@UPSTREAM@|$up|g" -e "s|@SHA@|$GITHUB_SHA|g" \
              -e "s|@CERT@|$(tr -d '[:space:]' < mod/mod-cert.sha256)|g" \
              -e "s|@PHONE@|$(basename "$phone")|g" -e "s|@WEAR@|$(basename "$wear")|g" \
              mod/release-notes.md > release-notes.md
          echo "Candidate **$VERSION-$RELEASE** (main ${GITHUB_SHA:0:7}, blocks: ${BLOCKS:-none}): APKs in this run's Artifacts (14 days)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mod-candidate-${{ needs.candidate-precheck.outputs.version }}-${{ needs.candidate-precheck.outputs.release }}
          path: |
            dist/
            release-notes.md
            mod-checks.txt
          if-no-files-found: error
          retention-days: 14
