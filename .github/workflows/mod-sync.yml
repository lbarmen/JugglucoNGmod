# JugglucoNGmod: daily check of upstream releases (stage 2 plan, block B; spec 3.4). No secrets, no environment,
# read-only token, nothing is pushed: main gets a release only through a PR sync/<release> opened from the computer.
#
# schedule (08:30 UTC)  latest upstream release (not a draft, not a pre-release; nightly-* are pre-releases):
#                       already in main -> green, short; MOD_SYNC_SKIP=<tag> -> green, silent; already verified
#                       for this main (artifact verified-<tag>-<main>) -> only the reminder; otherwise the full
#                       check, then the reminder "Release X waits for merge" stays red (that is the e-mail) until
#                       the release is in main.
# workflow_dispatch     always the full check: point = their release/commit (default: latest release),
#                       base = our branch (default main), mode merge | overlay (release tree + our files, for the
#                       run over past releases).
# pull_request -> main  the full check of the PR tree as it is (no new merge); report main -> PR. A PR of our .md
#                       files only (mod/our-paths.txt; not mod/HOOKS.md, check-hooks reads it; none under Common/,
#                       an .md in a source set may go into the APK): check + merge jobs
#                       only, build and tests skipped on purpose, report green in about a minute (owner's word 15.11).
# Jobs: check -> merge (merge in the job, report, hooks/budget/secrets) -> build (one-time key, phone + wear,
# check-apk --mode test, schema export) + tests (their JVM suites with our golden runs, guardrails, Python tests)
# -> report (red if anything is red or skipped) -> remind (schedule only).
# Cache (owner's decision 25.11.2026, after Maven answered 429 and red tests had to be re-run by hand): only the tests
# job keeps what it downloads between runs - Gradle modules, the Gradle wrapper, the android-all images Robolectric
# fetches into ~/.m2/repository. Safe: that job holds no secret and no signing key; the configuration cache and build
# outputs are not cached; a PR's cache (a fork's PR too) stays in that PR's own scope, main and other PRs never restore
# it, while every PR may restore main's (the morning run). The build job and mod-build.yml keep no Gradle cache.
# Their JVM command runs through mod/jvm-tests.py: a download failure -> the whole command again (3 attempts, 60 and
# 120 s apart); up to 5 classes of theirs red -> only those once more; our tests (mod.*) are never retried. Each
# retry is a row of the Tests table in the report.
name: MOD sync
run-name: >-
  ${{ github.event_name == 'pull_request' && format('MOD sync PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'schedule' && 'MOD sync (morning)' ||
  format('MOD sync {0} on {1} ({2})', inputs.point || 'latest release', inputs.base || 'main', inputs.mode || 'merge') }}

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      point:
        description: 'their release tag or commit (empty = latest release without pre-release mark)'
        required: false
        default: ''
      base:
        description: 'our branch to merge into (default main)'
        required: false
        default: 'main'
      mode:
        description: 'merge = base + their point; overlay = their point + our files from base'
        required: false
        default: 'merge'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # manual runs: one group per base + point + mode, so two different manual runs never cancel each other
  group: mod-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.base }}-${{ inputs.point }}-${{ inputs.mode }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM: https://github.com/ctqvva/JugglucoNG.git

jobs:
  check:
    name: check (which release, already in main?)
    if: github.repository == 'lbarmen/JugglucoNGmod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.c.outputs.mode }}
      kind: ${{ steps.c.outputs.kind }}
      tag: ${{ steps.c.outputs.tag }}
      point: ${{ steps.c.outputs.point }}
      base: ${{ steps.c.outputs.base }}
      docs: ${{ steps.c.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base || '' }}

      - id: c
        name: Pick their point and decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          POINT_IN: ${{ inputs.point }}
          MODE_IN: ${{ inputs.mode }}
          SKIP: ${{ vars.MOD_SYNC_SKIP }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags -q upstream main
          base=$(git rev-parse HEAD)
          latest=$(gh api "repos/ctqvva/JugglucoNG/releases?per_page=50" --jq \
            '[.[] | select(.draft | not) | select(.prerelease | not)] | sort_by(.published_at) | last | .tag_name')
          [ -n "$latest" ] && [ "$latest" != null ] || { echo "::error::no upstream release found (API)"; exit 1; }
          kind=merge
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="${POINT_IN:-$latest}"
            case "${MODE_IN:-merge}" in merge|overlay) kind="${MODE_IN:-merge}";; *) echo "::error::mode '$MODE_IN' is not merge or overlay"; exit 1;; esac
          elif [ "$EVENT" = pull_request ]; then
            tag=""; kind=pr
          else
            tag="$latest"
          fi
          point=""
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo "::error::point '$tag' has odd characters"; exit 1; }
            if git fetch --no-tags -q upstream "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
              point=$(git rev-parse "refs/tags/$tag^{commit}")
            else
              git fetch --no-tags -q upstream "$tag" || { echo "::error::'$tag' is neither their tag nor their commit"; exit 1; }
              point=$(git rev-parse FETCH_HEAD)
            fi
          fi
          mode=full
          if [ "$EVENT" = schedule ]; then
            if git merge-base --is-ancestor "$point" "$base"; then
              mode=skip; echo "Their latest release **$tag** is already in \`main\`: nothing to check." >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$SKIP" ] && [ "$SKIP" = "$tag" ]; then
              mode=skip; echo "Release **$tag** skipped by the owner's word (MOD_SYNC_SKIP)." >> "$GITHUB_STEP_SUMMARY"
            else
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-$tag-${base:0:9}&per_page=10" \
                --jq '[.artifacts[] | select(.expired | not)] | length')
              if [ "$n" -gt 0 ]; then
                mode=remind; echo "Release **$tag** is already checked on \`main\` ${base:0:9}: reminder only." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          docs=0
          if [ "$EVENT" = pull_request ]; then
            # our .md files only, plain files (mode 100644: no submodule, link or executable), none under Common/
            # (source sets: an .md there may go into the APK); any odd, quoted or empty list -> 0 -> the full check
            raw=$(git diff --raw --no-renames --no-abbrev "$PR_BASE" HEAD)
            docs=$(printf '%s\n' "$raw" | python3 -c "import sys; sys.path.insert(0, 'mod'); import mod_common as rc; r = [l.split('\t', 1) for l in sys.stdin.read().splitlines() if l]; print(int(bool(r) and all(len(x) == 2 and set(x[0].lstrip(':').split()[:2]) <= {'000000', '100644'} and x[1].endswith('.md') and x[1] != 'mod/HOOKS.md' and not x[1].startswith('Common/') and rc.is_ours(x[1]) for x in r)))")
            echo "PR files: $(printf '%s\n' "$raw" | grep -c . || true); our .md only: $docs"
            [ "$docs" = 1 ] && echo "PR of our .md files only: hooks, budget and secrets checks - yes, build and tests - no." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "event=$EVENT kind=$kind mode=$mode docs=$docs tag=${tag:-none} point=${point:-none} base=$base"
          { echo "mode=$mode"; echo "kind=$kind"; echo "tag=$tag"; echo "point=$point"; echo "base=$base"; echo "docs=$docs"; } >> "$GITHUB_OUTPUT"

  merge:
    name: merge (in the job), report, hooks, budget, secrets
    needs: check
    if: needs.check.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - name: Fetch upstream (main, tags, their point)
        env:
          POINT: ${{ needs.check.outputs.point }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch -q upstream main '+refs/tags/*:refs/tags/*'
          [ -z "$POINT" ] || git cat-file -e "$POINT^{commit}" 2>/dev/null || git fetch -q upstream "$POINT"

      - id: m
        name: Report and merge
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.check.outputs.kind }}
          TAG: ${{ needs.check.outputs.tag }}
          POINT: ${{ needs.check.outputs.point }}
          BASE: ${{ needs.check.outputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          git config user.name mod-sync
          git config user.email mod-sync@users.noreply.github.com
          case "$KIND" in
            pr)
              old=$(git merge-base "$PR_BASE" upstream/main); new=$(git merge-base HEAD upstream/main)
              echo "PR: their code main ${old:0:9} -> PR ${new:0:9}" ;;
            merge)
              old=$(git merge-base "$BASE" upstream/main); new="$POINT" ;;
            overlay)
              old="$POINT"; new="$POINT" ;;
          esac
          if [ "$KIND" = overlay ]; then
            echo "Overlay mode: the tree of their release $TAG plus our files; no report on the range." > out/sync-report.md
            echo '{}' > out/sync-report.json
          else
            python3 mod/sync-report.py "$old" "$new" --ours "$BASE" --out out/sync-report.md --json out/sync-report.json
          fi
          status=0
          if [ "$KIND" = merge ]; then
            if ! git merge --no-ff --no-edit -m "MOD sync: merge their ${TAG} into ${BASE:0:9} (in the job, not pushed)" "$POINT" > out/merge.txt 2>&1; then
              cat out/merge.txt
              { echo "CONFLICT merging $TAG:"; git diff --name-only --diff-filter=U | sed 's/^/- /'; } | tee out/conflict.txt
              echo "::error::merge conflict with $TAG: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort
              exit 1
            fi
          elif [ "$KIND" = overlay ]; then
            git ls-tree -r --name-only HEAD | python3 -c "import sys; sys.path.insert(0, 'mod'); import mod_common as rc; print('\n'.join(p for p in sys.stdin.read().split('\n') if p and rc.is_ours(p)))" > "$RUNNER_TEMP/ours.txt"
            git checkout -q --detach "$POINT"
            git checkout "$BASE" --pathspec-from-file="$RUNNER_TEMP/ours.txt"
            git commit -q -m "MOD sync overlay: their ${TAG} + our files from ${BASE:0:9}"
          fi
          git branch -f mod-sync-merged HEAD
          git rev-parse HEAD > out/merged.sha
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create out/merged.bundle "$BASE..mod-sync-merged"
          fi
          # their code in the checked tree: for the hooks budget and "our commits only" (base may already hold
          # their code newer than the point, e.g. main on unreleased upstream code before the first sync)
          if [ "$KIND" = overlay ]; then theirs="$POINT"; else theirs=$(git merge-base HEAD upstream/main); fi
          echo "theirs=$theirs" >> "$GITHUB_OUTPUT"
          echo "their code in the tree: ${theirs:0:9}"
          echo "Checked tree: $(git log --oneline -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Hooks registry, budget, secrets in our commits, golden scenarios unchanged
        env:
          THEIRS: ${{ steps.m.outputs.theirs }}
        run: |
          set -uo pipefail
          # each command runs in this shell, not in a pipeline subshell: a crash (no FAIL line) still turns it red
          fail=0; : > out/checks.txt
          run() { "$@" >> out/checks.txt 2>&1 || { echo "FAIL  $1 ${2:-}: exit $?" >> out/checks.txt; fail=1; }; }
          run python3 mod/check-hooks.py --ref HEAD --base "$THEIRS"
          run bash mod/check-secrets.sh --ours "$THEIRS"
          run python3 mod/golden/scenarios.py --check
          cat out/checks.txt
          grep -q '^FAIL' out/checks.txt && fail=1
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-merge
          path: out/
          if-no-files-found: warn
          retention-days: 1

  build:
    name: build mod phone + wear (one-time key), checks, schema export
    needs: [check, merge]
    if: needs.check.outputs.docs != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync-merge

      - name: The tree the merge job checked
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/sync-merge"
          if [ -f "$m/merged.bundle" ]; then
            git fetch -q "$m/merged.bundle" mod-sync-merged:mod-sync-merged
            git checkout -q mod-sync-merged
          fi
          [ "$(git rev-parse HEAD)" = "$(cat "$m/merged.sha")" ] || { echo "::error::tree differs from the merge job"; exit 1; }
          git log --oneline -1

      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the hooks check in check-apk)
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags -q upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      - name: Build mod phone + wear with a one-time signing key
        run: |
          set -euo pipefail
          umask 077
          kdir=$(mktemp -d "$RUNNER_TEMP/mod-onetime.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$kdir/onetime.p12" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias onetime -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JugglucoNGmod one-time test key" > /dev/null 2>&1
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/onetime.p12"
          export ORG_GRADLE_PROJECT_thepassword="$pw"
          export ORG_GRADLE_PROJECT_thekeyalias=onetime
          export ORG_GRADLE_PROJECT_thekeypassword="$pw"
          start=$(date +%s)
          bash mod/gradlew-mod.sh :Common:assembleMobileMod -PmodRelease=0 --no-daemon --no-configuration-cache --stacktrace
          bash mod/gradlew-mod.sh :Common:assembleWearMod -PmodRelease=0 --no-daemon --no-configuration-cache --stacktrace
          echo "gradle: $(( ($(date +%s) - start) / 60 )) min" | tee build-time.txt

      - name: Checks on the APKs and the schema export
        run: |
          set -euo pipefail
          phone=$(ls Common/build/outputs/apk/mobile/mod/*.apk)
          wear=$(ls Common/build/outputs/apk/wear/mod/*.apk)
          fail=0
          python3 mod/check-apk.py --phone "$phone" --wear "$wear" --release 0 --mode test > mod-checks.txt 2>&1 || fail=1
          if [ -n "$(git status --porcelain Common/schemas)" ]; then
            { echo "FAIL  Common/schemas changed during the build: their schema export is not committed"
              git status --porcelain Common/schemas; } >> mod-checks.txt
            fail=1
          else
            echo "OK    Common/schemas: the build regenerated nothing (their schema export is committed)" >> mod-checks.txt
          fi
          cat mod-checks.txt
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-build
          path: |
            Common/build/outputs/apk/mobile/mod/*.apk
            Common/build/outputs/apk/wear/mod/*.apk
            mod-checks.txt
            build-time.txt
          if-no-files-found: warn
          retention-days: 7

  tests:
    name: tests (their JVM suites + our golden runs, guardrails, Python tests)
    needs: [check, merge]
    if: needs.check.outputs.docs != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # downloaded dependencies only; restore and save must list the same paths (they are part of the cache version)
      MOD_DEPS: |
        ~/.gradle/caches/modules-2
        !~/.gradle/caches/modules-2/*.lock
        !~/.gradle/caches/modules-2/gc.properties
        ~/.gradle/wrapper/dists
        ~/.m2/repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync-merge

      - name: The tree the merge job checked
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/sync-merge"
          if [ -f "$m/merged.bundle" ]; then
            git fetch -q "$m/merged.bundle" mod-sync-merged:mod-sync-merged
            git checkout -q mod-sync-merged
          fi
          [ "$(git rev-parse HEAD)" = "$(cat "$m/merged.sha")" ] || { echo "::error::tree differs from the merge job"; exit 1; }
          git submodule update --init --recursive || {
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      # key: OS + the files that pin dependency versions in the checked tree (their Gradle files, wrapper, Robolectric
      # version in Common/build.gradle); a run of the same files restores it whole, a run with changed ones restores
      # the newest copy (Gradle then downloads only what is new)
      - id: deps-key
        name: Dependency cache key
        env:
          FILES_HASH: ${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
        run: echo "key=mod-tests-deps-v1-$RUNNER_OS-$FILES_HASH" | tee -a "$GITHUB_OUTPUT"

      - id: deps
        name: Restore downloaded dependencies (Gradle modules, wrapper, Robolectric android-all)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MOD_DEPS }}
          key: ${{ steps.deps-key.outputs.key }}
          restore-keys: |
            ${{ steps.deps-key.outputs.key }}-partial-
            mod-tests-deps-v1-${{ runner.os }}-

      # Their ci.yml jobs distribution-contract and ui-guardrails, step by step, without
      # `scripts/update-build-inputs.sh --ci` (it needs their official repository). When their ci.yml changes
      # (sync report, section 10), compare this list with it.
      - id: tests
        name: Their tests
        run: |
          set -uo pipefail
          mkdir -p out/logs
          fail=0; i=0
          t() {
            i=$((i + 1)); local name="$1"; shift; local s=$(date +%s)
            # a test script their code at this point does not have yet (came with a later release): not ours to fail
            if [ "$1" = python3 ] && [[ "${2:-}" == *.py ]] && [ ! -f "$2" ]; then
              echo "| $name | not in their code of this version ($2), skipped | 0 s |" | tee -a out/tests.md; return
            fi
            if "$@" > "out/logs/$i.txt" 2>&1; then r="green"; else r="**red** (log out/logs/$i.txt)"; fail=1; fi
            echo "| $name | $r | $(( $(date +%s) - s )) s |" | tee -a out/tests.md
          }
          echo "| check | result | time |" > out/tests.md
          echo "|---|---|---|" >> out/tests.md
          # mod/jvm-tests.py retries a download failure (whole command) and up to 5 red classes of theirs (only those),
          # never ours; `python3 -u`: unbuffered, so the log keeps Gradle's order (and t() does not take it for one
          # of their scripts that this version may lack)
          t "JVM: phone and watch, with our golden runs (testMobileDebugUnitTest, testWearDebugUnitTest)" \
            python3 -u mod/jvm-tests.py --results Common/build/test-results --notes out/jvm-notes.md \
              --deps-state out/deps-state.txt -- \
              ./gradlew :Common:testMobileDebugUnitTest :Common:testWearDebugUnitTest --continue --no-daemon --stacktrace
          # its retries and why it is red: rows right under the JVM row
          [ -s out/jvm-notes.md ] && tee -a out/tests.md < out/jvm-notes.md
          echo "deps=$(cat out/deps-state.txt 2>/dev/null || echo partial)" >> "$GITHUB_OUTPUT"
          t "UI guardrails" python3 scripts/ui-guardrails.py
          t "UI guardrails: tests" python3 -m unittest discover -s scripts/tests -v
          # without GITHUB_REPOSITORY, as on a developer's computer: test_readme_downloads expects their name or none
          t "Distribution: scripts/dist/tests" env -u GITHUB_REPOSITORY python3 -m unittest discover -s scripts/dist/tests -v
          t "Clone through TURN" python3 tools/test-clone-turn.py --streams
          t "TURN TLS and streams" python3 tools/test-turn-stream.py
          t "HTTPS token responses" python3 tools/test-context-https.py
          t "Rendezvous failover" python3 tools/test-rendezvous-failover.py
          t "Mirror calibration" python3 tools/test-mirror-calibration.py
          t "Mirror calibration: return" python3 tools/test-mirror-calibration-return.py
          t "Resolved glucose" python3 tools/test-resolved-glucose.py
          t "Nightscout: sending does not block fresh readings" python3 tools/test-nightscout-backlog.py
          t "Nightscout: data selection through JNI" python3 tools/test-nightscout-export-mode.py
          for f in Common/build/test-results/*/TEST-*.xml; do [ -f "$f" ] || continue
            python3 - "$f" >> out/junit.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          print(r.get('name'), r.get('tests'), r.get('failures'), r.get('errors'), r.get('skipped'), r.get('time'))
          PY
          done
          if [ -f out/junit.txt ]; then
            awk '{n+=$2; f+=$3+$4; s+=$5} END {printf "JVM tests: %d, failed %d, skipped %d\n", n, f, s}' out/junit.txt | tee out/junit-summary.txt
            grep -E '^mod\.' out/junit.txt | tee out/ours.txt || echo "OUR TESTS DID NOT RUN" | tee out/ours.txt
          fi
          exit $fail

      # also after red tests, so a re-run starts with what this one downloaded. Every test task ran with all its
      # downloads -> the main key; otherwise a "-partial-" key the next attempt restores from (a partial copy under
      # the main key would never be completed: an exact hit is not saved again)
      - name: Save downloaded dependencies
        if: ${{ !cancelled() && steps.deps.outputs.cache-hit != 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MOD_DEPS }}
          key: ${{ steps.deps-key.outputs.key }}${{ steps.tests.outputs.deps != 'complete' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-tests
          path: |
            out/
            Common/build/mod-golden/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: sync-test-reports
          path: |
            Common/build/reports/tests/
            Common/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    # 'report' is the required check of the main ruleset: only a PR run may carry that name (a manual run on a
    # PR branch checks main + their point, not the PR, and must not satisfy the PR's required check)
    name: ${{ github.event_name == 'pull_request' && 'report' || 'report (not a PR)' }}
    needs: [check, merge, build, tests]
    if: always() && github.repository == 'lbarmen/JugglucoNGmod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.check.outputs.mode == 'full'
        continue-on-error: true
        with:
          pattern: sync-*
          path: parts

      - name: Report page and verdict
        env:
          MODE: ${{ needs.check.outputs.mode }}
          KIND: ${{ needs.check.outputs.kind }}
          TAG: ${{ needs.check.outputs.tag }}
          BASE: ${{ needs.check.outputs.base }}
          DOCS: ${{ needs.check.outputs.docs }}
          R_CHECK: ${{ needs.check.result }}
          R_MERGE: ${{ needs.merge.result }}
          R_BUILD: ${{ needs.build.result }}
          R_TESTS: ${{ needs.tests.result }}
        run: |
          # no -e here: a missing part must not stop the page; the verdict is computed explicitly below
          set +e -u
          word() { case "$1" in success) echo "green";; skipped) echo "**skipped**";; cancelled) echo "**cancelled**";; *) echo "**red**";; esac; }
          if [ "$R_CHECK" != success ]; then
            echo "Job check: $(word "$R_CHECK")" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$MODE" = skip ] || [ "$MODE" = remind ]; then
            echo "The full check is not needed (mode=$MODE)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          why=""; [ "$DOCS" = 1 ] && why=" (PR of our .md files only: not needed)"
          p=parts
          # one matching artifact is unpacked straight into parts/ (no sync-merge/ folder): only the merge part can
          # be alone (merge red -> build and tests skipped)
          if [ ! -d $p/sync-merge ] && { [ -f $p/merged.sha ] || [ -f $p/sync-report.md ] || [ -f $p/conflict.txt ]; }; then
            mkdir $p/sync-merge && find $p -maxdepth 1 -type f -exec mv {} $p/sync-merge/ \;
          fi
          {
            echo "# MOD sync: ${TAG:-PR} — ${KIND}"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| merge: merge, report, hooks, budget, secrets | $(word "$R_MERGE") |"
            echo "| build: mod build, APK checks, DB schemas | $(word "$R_BUILD")$why |"
            echo "| tests: their tests and our golden runs | $(word "$R_TESTS")$why |"
            echo
            [ -f $p/sync-merge/conflict.txt ] && { cat $p/sync-merge/conflict.txt; echo; }
            if [ -f $p/sync-merge/checks.txt ]; then echo '### Hooks, budget, secrets checks'; echo '```'; cat $p/sync-merge/checks.txt; echo '```'; fi
            if [ -f $p/sync-build/mod-checks.txt ]; then echo '### APK checks'; echo '```'; cat $p/sync-build/mod-checks.txt; echo '```'; fi
            [ -f $p/sync-build/build-time.txt ] && cat $p/sync-build/build-time.txt
            if [ -f $p/sync-tests/out/tests.md ]; then echo; echo '### Tests'; cat $p/sync-tests/out/tests.md; fi
            [ -f $p/sync-tests/out/junit-summary.txt ] && { echo; cat $p/sync-tests/out/junit-summary.txt; }
            if [ -f $p/sync-tests/out/ours.txt ]; then echo; echo 'Our tests (class, tests, failed, errors, skipped, s):'; echo '```'; cat $p/sync-tests/out/ours.txt; echo '```'; fi
            g=""; for c in $p/sync-tests/Common/build/mod-golden/diff.md $p/sync-tests/mod-golden/diff.md; do [ -f "$c" ] && { g="$c"; break; }; done
            if [ -n "$g" ]; then echo; sed 's/^# /### /' "$g"
            elif [ "$DOCS" = 1 ]; then echo; echo '### Golden runs of alarms and forecast'; echo 'not needed: PR of our .md files only'
            else echo; echo '### Golden runs of alarms and forecast'; echo '**no result** (the tests did not reach them)'; fi
            echo
            [ -f $p/sync-merge/sync-report.md ] && sed 's/^# /## /' $p/sync-merge/sync-report.md
            true
          } > sync-report.md
          cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
          ok=1
          need="$R_MERGE $R_BUILD $R_TESTS"; [ "$DOCS" = 1 ] && need="$R_MERGE"
          for r in $need; do [ "$r" = success ] || ok=0; done
          if [ $ok = 1 ] && [ "$KIND" = merge ] && [ -n "$TAG" ]; then
            echo "verified $TAG on ${BASE}" > verified.txt
            echo "marker=verified-$TAG-${BASE:0:9}" >> "$GITHUB_ENV"
          fi
          echo "ok=$ok" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && needs.check.outputs.mode == 'full'
        with:
          name: sync-report
          path: sync-report.md
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.marker != ''
        with:
          name: ${{ env.marker }}
          path: verified.txt
          retention-days: 90

      - name: Verdict
        if: needs.check.outputs.mode == 'full'
        run: |
          [ "$ok" = 1 ] || { echo "::error::The check is red: something failed or was skipped - see the table in the report on this page."; exit 1; }
          echo "all green"

  remind:
    name: ${{ format('Release {0} waits for merge', needs.check.outputs.tag) }}
    needs: [check, report]
    if: always() && github.event_name == 'schedule' && needs.check.outputs.mode != 'skip' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TAG: ${{ needs.check.outputs.tag }}
          R_REPORT: ${{ needs.report.result }}
        run: |
          if [ "$R_REPORT" = success ]; then
            echo "::error::Their release $TAG is checked and waits for the merge into main: open the chat and write \"continue the merge thread\"."
          else
            echo "::error::Their release $TAG waits for the merge, but the check is red or did not finish (report: $R_REPORT): open the chat and write \"continue the merge thread\", the chat will go through the report on this page."
          fi
          exit 1

  mail-probe:
    name: Mail probe (MOD_SYNC_TEST_FAIL=1)
    if: github.event_name == 'schedule' && vars.MOD_SYNC_TEST_FAIL == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::A deliberately red job: a check that the e-mail about a red morning run arrives. The chat will delete the variable MOD_SYNC_TEST_FAIL."
          exit 1
